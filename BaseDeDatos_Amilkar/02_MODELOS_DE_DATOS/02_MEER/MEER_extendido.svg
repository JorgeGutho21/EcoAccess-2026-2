<text x='36' y='662' font-size='13' fill='#5B3A00'>Regla del negocio: quien verifica un dep&#243;sito debe ser OPERARIO o ADMINISTRADOR y distinto del CIUDADANO titular (trigger TRG_DEPOSITO_COHERENCIA, ORA-20101/20104).</text>
<text x='36' y='680' font-size='13' fill='#5B3A00'>Solo el ADMINISTRADOR cambia el estado de una caneca y registra tarifas (PKG_CONTEXTO_APP.exigir_rol, ORA-20120).</text>
