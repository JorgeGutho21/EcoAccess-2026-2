<line x1='1180' y1='975' x2='1210' y2='975' stroke='#333' stroke-width='1.6'/>
<text x='1195' y='965' text-anchor='middle' font-size='14' font-weight='700' fill='#B00020'>1</text>
<rect x='20' y='1026' width='1460' height='140' rx='8' fill='#F4F8F4' stroke='#9DB09D'/>
<text x='36' y='1050' font-size='13' fill='#2E4D3A'>C&#243;mo se implementa cada especializaci&#243;n en las 19 tablas (y por qu&#233;):</text>
<text x='36' y='1068' font-size='13' fill='#2E4D3A'>• Roles → tabla puente USUARIO_ROL (N:M) + cat&#225;logo ROL. Las subclases no tienen atributos propios, as&#237; que una tabla por rol solo duplicar&#237;a USUARIO; la superposici&#243;n (un operario que tambi&#233;n es ciudadano) cabe naturalmente en N:M.</text>
<text x='36' y='1086' font-size='13' fill='#2E4D3A'>• Dep&#243;sito → una sola tabla DEPOSITO con la columna discriminante sin_sensor y un CHECK; el trigger 2 exige que coincida con el tipo de evento (3 detecci&#243;n / 6 cierre sin sensor).</text>
<text x='36' y='1104' font-size='13' fill='#2E4D3A'>• Movimiento → una sola tabla MOVIMIENTO_ECOPUNTOS con tipo (1 cr&#233;dito / 2 reverso), CHECK de signo de puntos y FK id_movimiento_revertido para la relaci&#243;n &#171;revierte&#187; (1:1).</text>
<text x='36' y='1122' font-size='13' fill='#2E4D3A'>Se descarta la especializaci&#243;n de la V3 (CIUDADANO/SUPERVISOR/OPERARIO/ADMINISTRADOR como tablas): el rol SUPERVISOR no existe en P3 y los subtipos no ten&#237;an atributos que P3 use.</text>
</svg>
