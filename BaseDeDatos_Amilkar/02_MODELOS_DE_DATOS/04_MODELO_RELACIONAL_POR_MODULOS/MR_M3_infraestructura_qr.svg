<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='418' viewBox='0 0 1440 418' font-family='Segoe UI, Arial, sans-serif'><rect width='100%' height='100%' fill='#FFFFFF'/><text x='20' y='34' font-size='22' font-weight='bold' fill='#1B2631'>M&#243;dulo 3 &#183; Infraestructura y QR</text><text x='20' y='58' font-size='12.5' fill='#566573'>Una estaci&#243;n (PUNTO_INSTALACION, con su c&#243;digo QR) tiene varias canecas (CONTENEDOR). CONTENEDOR_MATERIAL dice qu&#233; materiales admite cada caneca (N:M con MATERIAL).</text><g transform='translate(20,78)'><rect x='24' y='24' width='1012' height='228' rx='12' fill='#EDF7F0' stroke='#1E8449' stroke-width='1.2' stroke-dasharray='6 4'/><text x='40' y='59' font-size='15' font-weight='bold' fill='#1E8449'>M&#243;dulo 3 &#183; Infraestructura y QR</text><path d='M 380 163 L 360 163 L 360 163 L 340 163' fill='none' stroke='#1E8449' stroke-width='1.5' stroke-linejoin='round'/><path d='M 380 156 L 368 163 L 380 170 M 365 157 L 365 169 M 347 169 L 347 157 M 352 169 L 352 157' fill='none' stroke='#1E8449' stroke-width='1.5'/><path d='M 720 163 L 700 163 L 700 163 L 680 163' fill='none' stroke='#1E8449' stroke-width='1.5' stroke-linejoin='round'/><path d='M 720 156 L 708 163 L 720 170 M 705 157 L 705 169 M 687 169 L 687 157 M 692 169 L 692 157' fill='none' stroke='#1E8449' stroke-width='1.5'/><path d='M 1020 163 L 1040 163 L 1040 163 L 1060 163' fill='none' stroke='#9A7D0A' stroke-width='1.5' stroke-linejoin='round'/><path d='M 1020 170 L 1032 163 L 1020 156 M 1035 169 L 1035 157 M 1053 157 L 1053 169 M 1048 157 L 1048 169' fill='none' stroke='#9A7D0A' stroke-width='1.5'/><g><rect x='40' y='86' width='300' height='134' rx='5' fill='#FFFFFF' stroke='#1E8449' stroke-width='1.8'/><path d='M 40 114 L 40 91 Q 40 86 45 86 L 335 86 Q 340 86 340 91 L 340 114 Z' fill='#1E8449'/><text x='190' y='105' font-size='13' font-weight='bold' fill='#FFFFFF' text-anchor='middle'>PUNTO_INSTALACION</text><text x='47' y='128' font-size='9.5' font