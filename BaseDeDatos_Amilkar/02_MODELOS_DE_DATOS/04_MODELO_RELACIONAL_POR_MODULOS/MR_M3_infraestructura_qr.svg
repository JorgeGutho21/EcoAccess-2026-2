ight='bold' fill='#5D6D7E'>PK UQ</text><text x='1112' y='168' font-size='11' font-weight='bold' fill='#A93226'>id_material*</text><text x='1353' y='168' font-size='9.5' fill='#7B7D7D' text-anchor='end'>NUMBER(10)</text></g></g><text x='20' y='382' font-size='11.5' fill='#566573'>PK clave primaria &#183; FK clave for&#225;nea &#183; UQ &#250;nica &#183; * obligatoria (NOT NULL) &#183; pata de gallo = lado &#171;muchos&#187; (tabla hija) &#183; doble barra = lado &#171;uno&#187; (tabla padre) &#183; color de la l&#237;nea = m&#243;dulo de la tabla padre.</text><text x='20' y='402' font-size='11' fill='#7F8C8D'>Generado desde los metadatos reales de ECOACCESS_BD (Oracle 26ai, FREEPDB1). FK dibujadas: 3 · líneas superpuestas: 0 · líneas que atraviesan tablas: 0 · cruces: 0.</text></svg>