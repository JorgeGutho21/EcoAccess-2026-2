<svg xmlns='http://www.w3.org/2000/svg' width='1668' height='634' viewBox='0 0 1668 634' font-family='Segoe UI, Arial, sans-serif'><defs><marker id='f' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#34495E'/></marker></defs><rect width='100%' height='100%' fill='#fff'/><text x='30' y='38' font-size='22' font-weight='bold' fill='#1B2631'>Flujo de los datos en EcoAccess: de la persona a Power BI</text><text x='30' y='62' font-size='12.5' fill='#566573'>Se lee como una serpiente: fila 1 de izquierda a derecha, fila 2 de derecha a izquierda, fila 3 de izquierda a derecha. Aparte: cada cambio de estado de una caneca queda en HISTORIAL_ESTADO_CONTENEDOR (disparador 1).</text><line x1='390' y1='149' x2='444' y2='149' stroke='#34495E' stroke-width='2.2' marker-end='url(#f)'/><line x1='806' y1='149' x2='860' y2='149' stroke='#34495E' stroke-width='2.2' marker-end='url(#f)'/><line x1='1222' y1='149' x2='1276' y2='149' stroke='#34495E' stroke-width='2.2' marker-end='url(#f)'/><line x1='1458' y1='208' x2='1458' y2='286' stroke='#34495E' stroke-width='2.2' marker-end='url(#f)'/><line x1='1278' y1='347' x2='1224' y2='347' stroke='#34495E' stroke-width='2.2' marker-end='url(#f)'/><line x1='862' y1='347' x2='808' y2='347' stroke='#34495E' stroke-width='2.2' marker-end='url(#f)'/><line x1='446' y1='347' x2='392' y2='347' stroke='#34495E' stroke-width='2.2' marker-end='url(#f)'/><line x1='210' y1='406' x2='210' y2='484' stroke='#34495E' stroke-width='2.2' marker-end='url(#f)'/><line x1='390' y1='545' x2='444' y2='545' stroke='#34495E' stroke-width='2.2' marker-end='url(#f)'/><line x1='806' y1='545' x2='860' y2='545' stroke='#34495E' stroke-width='2.2' marker-end='url(#f)'/><rect x='30' y='90' width='360' height='118' rx='10' fill='#D6EAF8' stroke='#2E6DA4' stroke-width='2'/><circle cx='52' cy='114' r='14' fill='#2E6DA4'/><text x='52' y='119' font-size='14' font-weight='bold' fill='#fff' text-anchor='middle'>1</text><text x='74' y='120' font-size='15' font-weight='bold' fill='#1B2631'>La persona existe</text><text x='44' y='152' font-size='12' font-weight='bold' fill='#2E6DA4'>USUARIO &#183; USUARIO_ROL &#183; VINCULO_TELEGRAM</text><text x='44' y='180' font-size='12' fill='#34495E'>Tiene cuenta, rol y chat de Telegram.</text><rect x='446' y='90' width='360' height='118' rx='10' fill='#D5F5E3' stroke='#1E8449' stroke-width='2'/><circle cx='468' cy='114' r='14' fill='#1E8449'/><text x='468' y='119' font-size='14' font-weight='bold' fill='#fff' text-anchor='middle'>2</text><text x='490' y='120' font-size='15' font-weight='bold' fill='#1B2631'>Escanea el QR de la estación</text><text x='460' y='152' font-size='12' font-weight='bold' fill='#1E8449'>PUNTO_INSTALACION</text><text x='460' y='180' font-size='12' fill='#34495E'>El QR dice en qu&#233; estaci&#243;n est&#225;.</text><rect x='862' y='90' width='360' height='118' rx='10' fill='#FADBD8' stroke='#B03A2E' stroke-width='2'/><circle cx='884' cy='114' r='14' fill='#B03A2E'/><text x='884' y='119' font-size='14' font-weight='bold' fill='#fff' text-anchor='middle'>3</text><text x='906' y='120' font-size='15' font-weight='bold' fill='#1B2631'>Se abre la sesión</text><text x='876' y='152' font-size='12' font-weight='bold' fill='#B03A2E'>INTERACCION</text><text x='876' y='180' font-size='12' fill='#34495E'>Une persona + estaci&#243;n (+ caneca).</text><rect x='1278' y='90' width='360' height='118' rx='10' fill='#FADBD8' stroke='#B03A2E' stroke-width='2'/><circle cx='1300' cy='114' r='14' fill='#B03A2E'/><text x='1300' y='119' font-size='14' font-weight='bold' fill='#fff' text-anchor='middle'>4</text><text x='1322' y='120' font-size='15' font-weight='bold' fill='#1B2631'>Envía una foto a la IA</text><text x='1292' y='152' font-size='12' font-weight='bold' fill='#B03A2E'>CONSULTA_VISION (+ MATERIAL, PESO_REFERENCIAL)</text><text x='1292' y='180' font-size='12' fill='#34495E'>Solo orienta: NO es un dep&#243;sito.</text><rect x='1278' y='288' width='360' height='118' rx='10' fill='#D5F5E3' stroke='#1E8449' stroke-width='2'/><circle cx='1300' cy='312' r='14' fill='#1E8449'/><text x='1300' y='317' font-size='14' font-weight='bold' fill='#fff' text-anchor='middle'>5</text><text x='1322' y='318' font-size='15' font-weight='bold' fill='#1B2631'>El sistema elige la caneca</text><text x='1292' y='350' font-size='12' font-weight='bold' fill='#1E8449'>CONTENEDOR &#183; CONTENEDOR_MATERIAL</text><text x='1292' y='378' font-size='12' fill='#34495E'>fn_resolver_caneca_disponible.</text><rect x='862' y='288' width='360' height='118' rx='10' fill='#FADBD8' stroke='#B03A2E' stroke-width='2'/><circle cx='884' cy='312' r='14' fill='#B03A2E'/><text x='884' y='317' font-size='14' font-weight='bold' fill='#fff' text-anchor='middle'>6</text><text x='906' y='318' font-size='15' font-weight='bold' fill='#1B2631'>Orden de abrir la caneca</text><text x='876' y='350' font-size='12' font-weight='bold' fill='#B03A2E'>ORDEN_APERTURA</text><text x='876' y='378' font-size='12' fill='#34495E'>Idempotente: una vigente por caneca.</text><rect x='446' y='288' width='360' height='118' rx='10' fill='#FADBD8' stroke='#B03A2E' stroke-width='2'/><circle cx='468' cy='312' r='14' fill='#B03A2E'/><text x='468' y='317' font-size='14' font-weight='bold' fill='#fff' text-anchor='middle'>7</text><text x='490' y='318' font-size='15' font-weight='bold' fill='#1B2631'>La caneca informa</text><text x='460' y='350' font-size='12' font-weight='bold' fill='#B03A2E'>EVENTO_DISPOSITIVO</text><text x='460' y='378' font-size='12' fill='#34495E'>Acuse, apertura, detecci&#243;n, cierre.</text><rect x='30' y='288' width='360' height='118' rx='10' fill='#FADBD8' stroke='#B03A2E' stroke-width='2'/><circle cx='52' cy='312' r='14' fill='#B03A2E'/><text x='52' y='317' font-size='14' font-weight='bold' fill='#fff' text-anchor='middle'>8</text><text x='74' y='318' font-size='15' font-weight='bold' fill='#1B2631'>Se registra el depósito</text><text x='44' y='350' font-size='12' font-weight='bold' fill='#B03A2E'>DEPOSITO (estado 0 = pendiente)</text><text x='44' y='378' font-size='12' fill='#34495E'>El disparador 2 valida la coherencia.</text><rect x='30' y='486' width='360' height='118' rx='10' fill='#E8DAEF' stroke='#6C3483' stroke-width='2'/><circle cx='52' cy='510' r='14' fill='#6C3483'/><text x='52' y='515' font-size='14' font-weight='bold' fill='#fff' text-anchor='middle'>9</text><text x='74' y='516' font-size='15' font-weight='bold' fill='#1B2631'>Un operario lo verifica</text><text x='44' y='548' font-size='12' font-weight='bold' fill='#6C3483'>DEPOSITO → AUDITORIA_DEPOSITO</text><text x='44' y='576' font-size='12' fill='#34495E'>Disparador 3: :OLD/:NEW. El 4 bloquea cerrados.</text><rect x='446' y='486' width='360' height='118' rx='10' fill='#E8DAEF' stroke='#6C3483' stroke-width='2'/><circle cx='468' cy='510' r='14' fill='#6C3483'/><text x='468' y='515' font-size='14' font-weight='bold' fill='#fff' text-anchor='middle'>10</text><text x='490' y='516' font-size='15' font-weight='bold' fill='#1B2631'>Se acreditan EcoPuntos</text><text x='460' y='548' font-size='12' font-weight='bold' fill='#6C3483'>MOVIMIENTO_ECOPUNTOS (+ REGLA_ECOPUNTOS)</text><text x='460' y='576' font-size='12' fill='#34495E'>PKG_ECOPUNTOS.acreditar; saldo = SUMA.</text><rect x='862' y='486' width='360' height='118' rx='10' fill='#EAECEE' stroke='#424949' stroke-width='2'/><circle cx='884' cy='510' r='14' fill='#424949'/><text x='884' y='515' font-size='14' font-weight='bold' fill='#fff' text-anchor='middle'>11</text><text x='906' y='516' font-size='15' font-weight='bold' fill='#1B2631'>Power BI lo muestra</text><text x='876' y='548' font-size='12' font-weight='bold' fill='#424949'>Vistas VW_BI_* (cuenta ECOACCESS_BD_LECTOR)</text><text x='876' y='576' font-size='12' fill='#34495E'>Solo lectura, con seud&#243;nimos.</text></svg>