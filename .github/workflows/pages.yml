# Publica la demostración pública del panel de canecas (web/panel-demo) en GitHub Pages.
# Es una estación SIMULADA en el navegador: no se conecta al ESP32 ni a Oracle y no contiene secretos.
# Requisito: GitHub Pages habilitado (repositorio público o plan que lo permita) y la variable del repositorio
# PAGES_HABILITADO=true (Settings → Secrets and variables → Actions → Variables). Sin ella el trabajo se omite.
name: Pagina de demostracion (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['web/panel-demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    if: ${{ vars.PAGES_HABILITADO == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/panel-demo
      - id: despliegue
        uses: actions/deploy-pages@v4
